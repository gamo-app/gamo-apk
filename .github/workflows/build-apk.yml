name: Compilar y publicar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma de release
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secret RELEASE_KEYSTORE_BASE64. Se usará la firma de depuración: el APK se podrá instalar, pero no actualizar sobre una versión anterior."
          fi

      - name: Compilar APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ARGS="-PversionCode=${GITHUB_RUN_NUMBER} -PversionName=1.0.${GITHUB_RUN_NUMBER}"
          if [ -f release.jks ]; then
            ARGS="$ARGS -PRELEASE_STORE_FILE=release.jks"
          fi
          ./gradlew assembleRelease $ARGS

      - name: Preparar archivos de publicación
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/gamo.apk
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p publicar
          cp app/build/outputs/apk/release/app-release.apk publicar/gamo.apk

          python3 - <<'PY'
          import json
          import os

          lineas = (os.environ.get("NOTES") or "").strip().splitlines()
          datos = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "url": os.environ["APK_URL"],
              "notes": lineas[0] if lineas else "",
          }

          with open("publicar/version.json", "w", encoding="utf-8") as archivo:
              json.dump(datos, archivo, ensure_ascii=False, indent=2)
          PY

          cat publicar/version.json

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamo-apk-${{ github.run_number }}
          path: publicar/gamo.apk
          if-no-files-found: error

      - name: Publicar release con el APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GAMO 1.0.${{ github.run_number }}
          body: |
            Compilación automática del commit `${{ github.sha }}`.

            Descarga el APK desde los archivos adjuntos (`gamo.apk`).
          files: |
            publicar/gamo.apk
            publicar/version.json
          make_latest: true
          draft: false
          prerelease: false

      - name: Borrar keystore temporal
        if: always()
        run: rm -f release.jks
