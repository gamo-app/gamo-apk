<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi QR sin conexión</title>
  <link rel="stylesheet" href="offline.css">
</head>
<body class="dark qr-sin-conexion">
  <main class="dark">
    <header>
      <img src="logo.svg" class="logo" alt="">
    </header>
    <section>
      <h1>Mi QR de asistencia</h1>
      <p id="estado">Cargando datos guardados…</p>
      <div id="qr" aria-label="Código QR"></div>
      <p id="ayuda">Mostrá este código al profesor para registrar tu asistencia.</p>
      <button type="button" class="azul" onclick="AndroidApp.volverSinConexion()">Volver</button>
    </section>
  </main>
  <script src="qrcodegen.js"></script>
  <script>
    try {
      const usuario = JSON.parse(AndroidApp.obtenerUsuarioSesion() || "{}");
      const codigoCredencial = (usuario.codigo_credencial || "").trim();
      const id = usuario.uuid_usuario;

      if (!codigoCredencial && !id) {
        throw new Error("No hay un usuario guardado. Conéctate e inicia sesión primero.");
      }

      // El QR de socio tiene el formato que espera el backend de GAMO:
      // GAMO:ASISTENCIA:SOCIO:{codigo_credencial}
      const payload = codigoCredencial
        ? "GAMO:ASISTENCIA:SOCIO:" + codigoCredencial
        : "http://gamo-ekk.pages.dev/escanear/" + encodeURIComponent(id);

      const codigo = qrcodegen.QrCode.encodeText(
        payload,
        qrcodegen.QrCode.Ecc.MEDIUM
      );
      const matriz = codigo.getModules();
      const margen = 4;
      const total = matriz.length + margen * 2;
      const celda = 8;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = total * celda;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      matriz.forEach((fila, y) => fila.forEach((oscura, x) => {
        if (oscura) ctx.fillRect((x + margen) * celda, (y + margen) * celda, celda, celda);
      }));
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      document.getElementById("qr").appendChild(canvas);

      if (codigoCredencial) {
        document.getElementById("estado").textContent =
          "QR de " + (usuario.nombre || "socio");
      } else {
        document.getElementById("estado").textContent =
          "Conéctate una vez con internet para actualizar tu QR de asistencia.";
      }
    } catch (error) {
      document.getElementById("estado").className = "error";
      document.getElementById("estado").textContent =
        error.message || "No se pudo generar el código QR.";
      document.getElementById("ayuda").style.display = "none";
    }
  </script>
</body>
</html>
