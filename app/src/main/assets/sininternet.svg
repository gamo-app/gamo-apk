<svg id="Capa_2" xmlns="http://www.w3.org/2000/svg" viewBox="-15 -5 600 655.85">
  <defs>
    <style>
      .cls-1 { fill: #fff; }
      .cls-2 { fill: #444; }
      .cls-3 { fill: #d19b5e; }
      .cls-4 { fill: #e2af70; }
      .cls-5 { clip-path: url(#clippath); }
      .cls-6 { fill: #7f7169; }
      .cls-7 { fill: #025af5; }
      .cls-8 { fill: none; }
      .cls-9 { fill: #999; }
      .cls-10 { fill: #ed1c24; }

      /* --- ANIMACIONES DE SIN INTERNET / BUSCANDO SEÑAL --- */

      /* 1. Alerta de no conexión (Parpadeo) */
      .internet {
        transform-origin: 450px 80px;
        animation: alertaInternet 0.6s step-end infinite alternate;
      }

      /* 2. Levantar el celular buscando señal */
      .brazoiz, .celular {
        animation: alzarCelular 1.5s ease-in-out infinite alternate;
      }

      /* 3. Mirar de un lado a otro (Confusión/Buscando) */
      .cabeza {
        transform-origin: 207px 295px; /* Eje en el cuello */
        animation: buscarSenal 3s ease-in-out infinite;
      }

      /* 4. Ligera impaciencia en el cuerpo */
      .torso, .piernzade, .brazode {
        transform-origin: center bottom;
        animation: impaciencia 1.5s ease-in-out infinite alternate;
      }

      /* --- KEYFRAMES --- */
      @keyframes alertaInternet {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.15; transform: scale(0.95); }
      }

      @keyframes alzarCelular {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-20px) translateX(5px); }
      }

      @keyframes buscarSenal {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-5deg); }
        75% { transform: rotate(7deg); }
      }

      @keyframes impaciencia {
        0% { transform: translateY(0px); }
        100% { transform: translateY(6px); }
      }
    </style>
